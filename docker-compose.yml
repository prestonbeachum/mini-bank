# Local stack. WireMock, Toxiproxy, Grafana and the OTel collector join in the phases that need them.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    ports:
      - "${MINIBANK_PG_PORT:-5433}:5432"   # host 5432 is often taken by other local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d minibank"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/minibank
      DATABASE_USER: minibank
      DATABASE_PASSWORD: minibank
      # Local-only synthetic credentials. Shared environments read these from SSM Parameter Store.
      MINIBANK_OPS_CLIENT_ID: cli_ops_local
      MINIBANK_OPS_CLIENT_SECRET: local-ops-secret
      MINIBANK_SERVICE_CLIENT_ID: cli_service_local
      MINIBANK_SERVICE_CLIENT_SECRET: local-service-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
