$kind: http-example
name: 200 UP
request:
  method: GET
  url: '{{base_url}}/health'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/vnd.spring-boot.actuator.v3+json
  body:
    type: json
    content: |-
      {"status":"UP","components":{"db":{"status":"UP"},"diskSpace":{"status":"UP"},"ping":{"status":"UP"}}}
order: 1000
