$kind: http-request
method: GET
url: '{{base_url}}/v1/accounts/{{checking_id}}/transactions?limit=10'
queryParams:
  - key: limit
    value: '10'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const page = pm.response.json();
      pm.test('two entries, newest first', () => {
        pm.expect(page.items.map(e => e.amount_minor)).to.eql([-2500, 10000]);
      });
      pm.test('single page', () => pm.expect(page.next_cursor).to.eql(null));
