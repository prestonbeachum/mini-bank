$kind: http-request
name: 'insufficient funds (422)'
method: POST
url: '{{base_url}}/v1/transfers'
order: 16000
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Idempotency-Key
    value: '{{$guid}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ada_token}}'
body:
  type: json
  content: |-
    {"source_account_id": "{{ada_account}}", "destination_account_id": "{{eve_account}}", "amount_minor": 4001, "currency": "USD"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('problem+json', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
      pm.test('type is insufficient-funds', () => pm.expect(pm.response.json().type).to.match(/\/insufficient-funds$/));
