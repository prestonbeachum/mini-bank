$kind: http-request
method: POST
url: '{{base_url}}/v1/deposits'
order: 9000
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Idempotency-Key
    value: '{{$guid}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{service_token}}'
body:
  type: json
  content: |-
    {"account_id": "{{ada_account}}", "amount_minor": 5000, "currency": "USD"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('deposit posted', () => pm.response.to.have.status(201));
