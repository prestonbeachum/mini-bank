$kind: http-request
name: 'no token (401)'
method: GET
url: '{{base_url}}/v1/accounts/{{ada_account}}'
order: 17000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401));
      pm.test('problem+json', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
      pm.test('type is unauthorized', () => pm.expect(pm.response.json().type).to.match(/\/unauthorized$/));
