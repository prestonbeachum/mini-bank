name: ci

# Every PR and every push to main (build doc section 11). Target: all checks green in under 10 minutes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formatting (Spotless)
        working-directory: app
        run: ./mvnw -B -q spotless:check
      - name: Unit, property, concurrency and integration tests (Testcontainers Postgres)
        working-directory: app
        run: ./mvnw -B verify
      - name: SBOM is in the build
        run: test -s app/target/classes/META-INF/sbom/application.cdx.json
      # Runs after the build so Trivy resolves dependencies from the warm ~/.m2, not Maven Central.
      - name: Dependency and Dockerfile scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: app/target,postman/skills
          exit-code: '1'

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install Postman CLI
        run: curl -fsSL https://dl-cli.pstmn.io/install/linux64.sh | sh
      - name: Lint OpenAPI spec
        run: postman spec lint api/openapi.yaml --issueType=syntax
      - name: Lint Postman collections and environments
        run: |
          for c in postman/collections/*/; do postman collection lint "$c"; done
          postman environment lint postman/environments
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Smoke collection
        run: postman collection run postman/collections/smoke -e postman/environments/local.environment.yaml
      - name: Negative collection
        run: postman collection run postman/collections/negative -e postman/environments/local.environment.yaml
      - name: Contract fuzzing (Schemathesis, every role)
        run: scripts/fuzz.sh
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
