name: release

# Build once, promote by reference (build doc section 11).
#   1. release-please keeps a release PR up to date from Conventional Commits on main.
#   2. Merging that PR tags vX.Y.Z and creates the GitHub Release; this workflow then builds the
#      JAR once, wraps it (container image, Lambda zip), scans, signs and publishes everything.
#   Later deploy jobs take an image digest or a release asset, never rebuild, and verify signatures.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build, scan, sign, publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # attach assets to the GitHub Release
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing via GitHub OIDC
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the JAR once (full test suite)
        working-directory: app
        run: ./mvnw -B verify

      - name: Assemble release bundle
        run: scripts/package.sh "$VERSION"

      - name: Wrap the JAR in the release image
        run: |
          docker build -f Dockerfile.release \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$GITHUB_SHA" .

      # Gate: any fixable CRITICAL blocks the release. The full report (including HIGH) is attached.
      - name: Image scan gate (Trivy, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Image scan report (Trivy, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          scanners: vuln
          format: json
          output: dist/trivy-image-${{ env.VERSION }}.json
          exit-code: '0'
          skip-setup-trivy: true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and record its digest
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "IMAGE_REF=$DIGEST" >> "$GITHUB_ENV"
          echo "$DIGEST" > "dist/image-$VERSION.txt"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and attach SBOM attestation (keyless)
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx --predicate "dist/mini-bank-$VERSION-sbom.cdx.json" "$IMAGE_REF"
      - name: Finalize checksums (before anything is signed)
        run: |
          rm -rf dist/docker
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | sort | xargs shasum -a 256 > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Sign release blobs (keyless)
        run: |
          for f in "dist/mini-bank-$VERSION.jar" "dist/mini-bank-$VERSION-lambda.zip" dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attach the release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          {
            echo "### Released $TAG"
            echo
            echo "- Image: \`$IMAGE_REF\` (signed, SBOM attested)"
            echo "- Assets: $(ls dist | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
